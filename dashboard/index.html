<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex 调度面板</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1f2328; --muted: #6b7280; --line: #e6e8eb; --hover: #f8f9fb;
    --accent: #4f46e5; --accent-soft: #eef2ff;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7;
    --err: #b91c1c; --err-bg: #fee2e2; --run: #1d4ed8; --run-bg: #dbeafe; --gray-bg: #f1f2f4;
    --radius: 10px; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e6e8eb; --muted: #9aa3af; --line: #262a33; --hover: #1c2028;
      --accent: #818cf8; --accent-soft: #1e2140;
      --ok: #4ade80; --ok-bg: #11301d; --warn: #fbbf24; --warn-bg: #362709;
      --err: #f87171; --err-bg: #3a1515; --run: #60a5fa; --run-bg: #132848; --gray-bg: #232731;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .bar { max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
  .bar h1 { font-size: 17px; margin: 0; font-weight: 650; white-space: nowrap; }
  main > *, .grid2 > * { min-width: 0; }
  .table-wrap { overflow-x: auto; }
  .bar .sub { color: var(--muted); font-size: 12px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  button, select, input[type=search] { font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; }
  button { cursor: pointer; } button:hover { background: var(--hover); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 24px 48px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
  .card h2 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .stat .label { color: var(--muted); font-size: 12.5px; }
  .stat .value { font-size: 24px; font-weight: 650; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .stat .hint { color: var(--muted); font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 6px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .chart .stack { width: 100%; max-width: 26px; display: flex; flex-direction: column-reverse; border-radius: 4px 4px 0 0; overflow: hidden; }
  .chart .seg-ok { background: var(--accent); } .chart .seg-bad { background: var(--err); }
  .chart .n { font-size: 11px; color: var(--muted); min-height: 15px; }
  .chart .d { font-size: 11px; color: var(--muted); }
  .dist { display: grid; gap: 14px; }
  .dist h3 { font-size: 12.5px; color: var(--muted); font-weight: 500; margin: 0 0 6px; }
  .brow { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 8px; font-size: 13px; margin: 3px 0; }
  .brow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow .track { background: var(--gray-bg); border-radius: 4px; height: 8px; overflow: hidden; }
  .brow .fill { background: var(--accent); height: 100%; border-radius: 4px; }
  .brow .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input[type=search] { flex: 1; min-width: 200px; }
  .toolbar .count { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: var(--hover); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .t-title { font-weight: 550; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-sub { color: var(--muted); font-size: 12.5px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nowrap { white-space: nowrap; } .muted { color: var(--muted); } .mono { font-family: var(--mono); font-size: 12.5px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 550; white-space: nowrap; }
  .b-ok { background: var(--ok-bg); color: var(--ok); } .b-warn { background: var(--warn-bg); color: var(--warn); }
  .b-err { background: var(--err-bg); color: var(--err); } .b-run { background: var(--run-bg); color: var(--run); }
  .b-gray { background: var(--gray-bg); color: var(--muted); }
  .tag { display: inline-block; padding: 0 6px; border-radius: 5px; font-size: 12px; background: var(--gray-bg); color: var(--muted); font-family: var(--mono); }
  .tag.e-high { background: var(--accent-soft); color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 36px 0; }
  .alert { border-radius: var(--radius); padding: 12px 16px; background: var(--warn-bg); color: var(--warn); }
  .pend { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .pend:last-child { border-bottom: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--run); flex: none; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  dialog { border: 0; padding: 0; margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(720px, 100vw);
    background: var(--card); color: var(--text); box-shadow: -8px 0 30px rgba(0,0,0,.15); }
  dialog::backdrop { background: rgba(15, 17, 21, .35); }
  .dlg-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); }
  .dlg-head h2 { margin: 0; font-size: 16px; word-break: break-all; }
  .dlg-head > div { min-width: 0; flex: 1; }
  .dlg-head button { margin-left: auto; flex: none; white-space: nowrap; }
  .dlg-body { padding: 16px 20px 32px; display: grid; gap: 18px; }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-all; }
  .sec h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 550; }
  .sec ul { margin: 0; padding-left: 18px; } .sec li { margin: 2px 0; }
  pre { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 550; margin-bottom: 6px; }
  .chk { display: flex; gap: 8px; align-items: baseline; margin: 3px 0; font-size: 13px; }
  /* 调度策略 */
  #pdlg { width: min(860px, 100vw); }
  #pdlg .dlg-head { align-items: center; }
  #pdlg .dlg-head h2 { flex: none; }
  .p-acts { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  #pdlg .p-acts button { margin-left: 0; }
  .p-dirty { font-size: 12.5px; color: var(--warn); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent); filter: brightness(1.08); }
  button.primary:disabled { opacity: .45; cursor: default; filter: none; }
  button.ghost { border-color: transparent; background: none; color: var(--muted); }
  button.ghost:hover { background: var(--hover); color: var(--text); }
  .p-body { padding: 18px 20px 32px; display: grid; gap: 22px; }
  .p-sec h3 { font-size: 13px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: baseline; gap: 8px; }
  .p-sec h3 small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .ladder { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lrow { display: grid; grid-template-columns: 22px 104px 176px 84px 1fr 64px; gap: 8px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line); }
  .lrow:first-child { border-top: 0; }
  .lrow.lhead { background: var(--bg); color: var(--muted); font-size: 12px; padding-block: 6px; }
  .lrow:not(.lhead):hover { background: var(--hover); }
  .lrow .n { color: var(--muted); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
  .lrow input, .lrow select, .p-text textarea { font: inherit; font-size: 13px; color: var(--text); width: 100%; min-width: 0;
    background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; }
  .lrow input:hover, .lrow select:hover, .p-text textarea:hover { border-color: var(--line); }
  .lrow input:focus, .lrow select:focus, .p-text textarea:focus { border-color: var(--accent); background: var(--card); outline: none; }
  .lrow .mono { font-family: var(--mono); font-size: 12.5px; }
  .lrow .ops { display: flex; justify-content: flex-end; gap: 2px; opacity: 0; transition: opacity .12s; }
  .lrow:hover .ops, .lrow:focus-within .ops { opacity: 1; }
  .ops button { border: 0; background: none; padding: 2px 5px; color: var(--muted); line-height: 1; }
  .ops button:hover:not(:disabled) { color: var(--text); background: var(--gray-bg); }
  .ops button:disabled { opacity: .3; cursor: default; }
  .ladd { width: 100%; border: 0; border-top: 1px dashed var(--line); border-radius: 0; background: none; color: var(--muted); padding: 7px; font-size: 13px; }
  .ladd:hover { color: var(--accent); background: var(--accent-soft); }
  .p-texts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .p-text label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .p-text textarea { border-color: var(--line); background: var(--bg); resize: vertical; line-height: 1.5; min-height: 150px; padding: 8px 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono); font-size: 12px; border-radius: 999px; padding: 3px 11px; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .toast { border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .toast.ok { background: var(--ok-bg); color: var(--ok); } .toast.err { background: var(--err-bg); color: var(--err); }
  .toast.info { background: var(--gray-bg); color: var(--muted); }
  @media (max-width: 700px) {
    .lrow { grid-template-columns: 1fr 1.3fr 80px; row-gap: 2px; } .lrow.lhead, .lrow .n { display: none; }
    .lrow .use { grid-column: span 2; } .lrow .ops { opacity: 1; } .p-texts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Codex 调度面板</h1>
    <span class="sub" id="runsDir"></span>
    <div class="right">
      <span id="updated">加载中…</span>
      <label><input type="checkbox" id="auto" checked> 自动刷新</label>
      <button id="refresh" type="button">刷新</button>
      <button id="policyBtn" type="button">调度策略</button>
    </div>
  </div>
</header>
<main>
  <div id="alert" class="alert" hidden></div>

  <section class="card" id="pendingCard" hidden>
    <h2>进行中 / 被中断 <small id="pendingCount"></small></h2>
    <div id="pendingList"></div>
  </section>

  <section class="card">
    <div class="stats" id="stats"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>近 14 天调用 <small>紫色为成功，红色为失败 / 中断</small></h2>
      <div class="chart" id="chart"></div>
    </section>
    <section class="card">
      <h2>调度分布</h2>
      <div class="dist" id="dist"></div>
    </section>
  </div>

  <section class="card">
    <h2>调用记录</h2>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索标题、任务内容、项目、session…" aria-label="搜索">
      <select id="fState" aria-label="按状态筛选">
        <option value="">全部状态</option>
        <option value="ok">成功</option>
        <option value="bad">失败 / 中断</option>
        <option value="running">进行中</option>
      </select>
      <select id="fEffort" aria-label="按 effort 筛选"><option value="">全部 effort</option></select>
      <span class="count" id="count"></span>
    </div>
    <div class="table-wrap"><table>
      <thead>
        <tr>
          <th>时间</th><th>任务</th><th class="hide-sm">模型 / effort</th><th>状态</th>
          <th class="num">耗时</th><th class="num hide-sm">Token</th><th class="hide-sm">改动</th><th>检查</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <div>
      <h2 id="dlgTitle"></h2>
      <div class="muted mono" id="dlgId"></div>
    </div>
    <button type="button" id="dlgClose" aria-label="关闭">关闭</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<dialog id="pdlg" aria-labelledby="pTitle">
  <form id="pForm" novalidate>
    <div class="dlg-head">
      <h2 id="pTitle">调度策略</h2>
      <div class="p-acts">
        <span class="p-dirty" id="pDirty"></span>
        <button type="button" class="ghost" id="pReset">恢复默认</button>
        <button type="submit" class="primary" id="pSave" disabled>保存</button>
        <button type="button" id="pClose" aria-label="关闭">✕</button>
      </div>
    </div>
    <div class="p-body">
      <div id="pMsg" class="toast" role="status" hidden></div>
      <section class="p-sec">
        <h3>成本档位 <small>从上到下由便宜到贵，失败后往下升一档</small></h3>
        <div class="ladder">
          <div class="lrow lhead" aria-hidden="true"><span></span><span>档位</span><span>模型</span><span>推理</span><span>适用场景（给 Claude 看）</span><span></span></div>
          <div id="tiers"></div>
          <button type="button" class="ladd" id="addTier">+ 添加档位</button>
        </div>
      </section>
      <section class="p-sec">
        <h3>提示词</h3>
        <div class="p-texts">
          <div class="p-text"><label for="pGuide">Claude：怎么选档位、哪些活自己干</label><textarea id="pGuide"></textarea></div>
          <div class="p-text"><label for="pCodex">Codex：执行时怎么省</label><textarea id="pCodex"></textarea></div>
        </div>
      </section>
      <section class="p-sec">
        <h3>允许的模型 <small>都不选 = 不限制</small></h3>
        <div class="chips" id="pModels"></div>
      </section>
      <div class="muted mono" id="pFile" style="font-size:11.5px"></div>
    </div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const fmtTime = (ms) => { if (!ms) return "—"; const d = new Date(ms); return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtFull = (ms) => ms ? new Date(ms).toLocaleString("zh-CN", { hour12: false }) : "—";
const fmtDur = (ms) => {
  if (ms == null) return "—";
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m ${pad(s % 60)}s`;
  return `${Math.floor(s / 3600)}h ${pad(Math.floor(s % 3600 / 60))}m`;
};
const fmtTok = (n) => n == null ? "—" : n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
const base = (p) => p ? String(p).split(/[\\/]/).filter(Boolean).pop() : "";
const dur = (r) => r.durationMs ?? (r.endedAt && r.startedAt ? r.endedAt - r.startedAt : r.state === "running" ? Date.now() - r.startedAt : null);
const isBad = (r) => r.state === "error" || r.state === "interrupted" || r.reportStatus === "blocked";

const STATE = { running: ["进行中", "b-run"], ok: ["完成", "b-ok"], error: ["出错", "b-err"], interrupted: ["已中断", "b-warn"] };
const REPORT = { done: ["完成", "b-ok"], partial: ["部分完成", "b-warn"], blocked: ["受阻", "b-err"], needs_decision: ["待决策", "b-warn"] };
const badge = ([t, c]) => `<span class="badge ${c}">${esc(t)}</span>`;
function statusBadge(r) {
  if (r.state === "ok" && REPORT[r.reportStatus]) return badge(REPORT[r.reportStatus]);
  return badge(STATE[r.state] ?? [r.state || "未知", "b-gray"]);
}
function checksCell(r) {
  if (!r.checks?.length) return '<span class="muted">—</span>';
  const pass = r.checks.filter((c) => c.ok).length;
  return badge([`${pass}/${r.checks.length} 通过`, pass === r.checks.length ? "b-ok" : "b-err"]);
}
function changesCell(r) {
  if (!r.changes) return '<span class="muted">—</span>';
  if (!r.changes.length) return '<span class="muted">无</span>';
  const add = r.changes.reduce((a, c) => a + (c.added || 0), 0), del = r.changes.reduce((a, c) => a + (c.removed || 0), 0);
  return `<span class="nowrap">${r.changes.length} 个文件 <span style="color:var(--ok)">+${add}</span> <span style="color:var(--err)">-${del}</span></span>`;
}
const titleOf = (r) => r.title || (r.prompt || "").split("\n").find((l) => l.trim())?.replace(/^#+\s*/, "").slice(0, 80) || r.id;

let data = null;
function renderStats(runs) {
  const done = runs.filter((r) => r.state !== "running");
  const ok = done.filter((r) => !isBad(r)).length;
  const tok = runs.reduce((a, r) => { const t = r.tokens || {}; a.in += t.input || 0; a.cached += t.cachedInput || 0; a.out += t.output || 0; return a; }, { in: 0, cached: 0, out: 0 });
  const totalMs = done.reduce((a, r) => a + (dur(r) || 0), 0);
  const checks = runs.flatMap((r) => r.checks || []);
  const cPass = checks.filter((c) => c.ok).length;
  const today = new Date().toDateString();
  const todayN = runs.filter((r) => new Date(r.startedAt).toDateString() === today).length;
  const cards = [
    ["调用次数", runs.length, `今天 ${todayN} 次`],
    ["成功率", done.length ? Math.round(ok / done.length * 100) + "%" : "—", `${ok} / ${done.length} 次完成`],
    ["平均耗时", done.length ? fmtDur(totalMs / done.length) : "—", `累计 ${fmtDur(totalMs)}`],
    ["Codex Token", fmtTok(tok.in + tok.out), `输入 ${fmtTok(tok.in)}（缓存 ${tok.in ? Math.round(tok.cached / tok.in * 100) : 0}%）· 输出 ${fmtTok(tok.out)}`],
    ["主机检查", checks.length ? `${cPass}/${checks.length}` : "—", checks.length ? `通过率 ${Math.round(cPass / checks.length * 100)}%` : "未配置 checks"],
  ];
  $("#stats").innerHTML = cards.map(([l, v, h]) => `<div class="stat"><div class="label">${l}</div><div class="value">${esc(v)}</div><div class="hint">${esc(h)}</div></div>`).join("");
}

function renderChart(runs) {
  const days = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); days.push({ d, ok: 0, bad: 0 }); }
  for (const r of runs) {
    const d = new Date(r.startedAt); d.setHours(0, 0, 0, 0);
    const slot = days.find((x) => x.d.getTime() === d.getTime());
    if (slot) isBad(r) ? slot.bad++ : slot.ok++;
  }
  const max = Math.max(1, ...days.map((x) => x.ok + x.bad));
  $("#chart").innerHTML = days.map((x) => {
    const n = x.ok + x.bad, h = n / max * 100;
    const label = `${x.d.getMonth() + 1}/${x.d.getDate()}：${n} 次${x.bad ? `（失败 ${x.bad}）` : ""}`;
    return `<div class="col" title="${esc(label)}"><span class="n">${n || ""}</span>
      <div class="stack" style="height:${h}%">${x.ok ? `<div class="seg-ok" style="flex:${x.ok}"></div>` : ""}${x.bad ? `<div class="seg-bad" style="flex:${x.bad}"></div>` : ""}</div>
      <span class="d">${x.d.getDate()}</span></div>`;
  }).join("");
}

function bars(title, map) {
  const list = Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const max = Math.max(1, ...list.map((x) => x[1]));
  const rows = list.map(([k, v]) => `<div class="brow"><span class="name" title="${esc(k)}">${esc(k)}</span><div class="track"><div class="fill" style="width:${v / max * 100}%"></div></div><span class="num">${v}</span></div>`).join("");
  return `<div><h3>${title}</h3>${rows || '<div class="muted">暂无</div>'}</div>`;
}
function renderDist(runs) {
  const count = (f) => runs.reduce((m, r) => { const k = f(r); m[k] = (m[k] || 0) + 1; return m; }, {});
  $("#dist").innerHTML = bars("档位 / Effort", count((r) => r.tier || r.effort || "默认")) +
    bars("模型", count((r) => r.model || (r.resumed ? "沿用会话" : "config 默认"))) +
    bars("项目", count((r) => base(r.cwd) || "—"));
}

function renderPending(pending, tasks) {
  const items = [
    ...pending.map((p) => ({ kind: p.state === "interrupted" ? "被中断" : "运行中", title: p.title || (p.prompt || "").split("\n")[0], cwd: p.cwd, t: p.startedAt, sid: p.sessionId, live: p.state === "running" })),
    ...tasks.filter((t) => t.status === "running").map((t) => ({ kind: "后台任务", title: t.title || t.id, t: t.startedAt, live: true })),
  ];
  $("#pendingCard").hidden = !items.length;
  $("#pendingCount").textContent = items.length ? `${items.length} 项` : "";
  $("#pendingList").innerHTML = items.map((p) => `<div class="pend">
      ${p.live ? '<span class="dot" aria-hidden="true"></span>' : badge(["中断", "b-warn"])}
      <div style="min-width:0;flex:1"><div class="t-title">${esc(p.title || "（无标题）")}</div>
      <div class="t-sub">${esc(p.kind)} · ${esc(base(p.cwd))} · 开始于 ${fmtTime(p.t)}${p.sid ? ` · <span class="mono">${esc(p.sid)}</span>` : ""}</div></div>
      ${p.live ? `<span class="muted nowrap">${fmtDur(Date.now() - p.t)}</span>` : ""}</div>`).join("");
}
function filtered() {
  const q = $("#q").value.trim().toLowerCase(), st = $("#fState").value, ef = $("#fEffort").value;
  return data.runs.filter((r) => {
    if (st === "ok" && (r.state !== "ok" || isBad(r))) return false;
    if (st === "bad" && !isBad(r)) return false;
    if (st === "running" && r.state !== "running") return false;
    if (ef && (r.effort || "默认") !== ef) return false;
    if (q && ![r.title, r.prompt, r.summary, r.cwd, r.sessionId, r.model, r.id].some((v) => v && String(v).toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderTable() {
  const runs = filtered();
  $("#count").textContent = `共 ${runs.length} 条`;
  if (!runs.length) { $("#rows").innerHTML = `<tr><td colspan="8" class="empty">${data.runs.length ? "没有匹配的记录" : "还没有调用记录。通过 delegate 调用一次 Codex 后会出现在这里。"}</td></tr>`; return; }
  $("#rows").innerHTML = runs.map((r) => {
    const t = r.tokens;
    const sub = [base(r.cwd), r.summary || ""].filter(Boolean).join(" · ");
    return `<tr tabindex="0" data-id="${esc(r.id)}">
      <td class="nowrap muted">${fmtTime(r.startedAt)}</td>
      <td><div class="t-title" title="${esc(titleOf(r))}">${r.resumed ? '<span class="tag" title="续接已有会话">续</span> ' : ""}${esc(titleOf(r))}</div><div class="t-sub" title="${esc(sub)}">${esc(sub)}</div></td>
      <td class="hide-sm nowrap"><div class="mono">${esc(r.model || "默认")}</div>${r.tier ? `<span class="tag" title="成本档位">${esc(r.tier)}</span> ` : ""}${r.effort ? `<span class="tag ${["high", "xhigh", "max", "ultra"].includes(r.effort) ? "e-high" : ""}">${esc(r.effort)}</span>` : ""} ${r.sandbox === "read-only" ? '<span class="tag">只读</span>' : ""}${r.fast ? ' <span class="tag">fast</span>' : ""}</td>
      <td>${statusBadge(r)}</td>
      <td class="num">${fmtDur(dur(r))}</td>
      <td class="num hide-sm" title="${t ? `输入 ${t.input}（缓存 ${t.cachedInput}）/ 输出 ${t.output}` : ""}">${t ? fmtTok(t.input + t.output) : "—"}</td>
      <td class="hide-sm">${changesCell(r)}</td>
      <td>${checksCell(r)}</td></tr>`;
  }).join("");
}

function syncEffortFilter() {
  const sel = $("#fEffort"), cur = sel.value;
  const efforts = [...new Set(data.runs.map((r) => r.effort || "默认"))].sort();
  sel.innerHTML = '<option value="">全部 effort</option>' + efforts.map((e) => `<option${e === cur ? " selected" : ""}>${esc(e)}</option>`).join("");
}

function render() {
  $("#runsDir").textContent = data.runsDir ? `· ${data.runsDir}` : "";
  $("#updated").textContent = `更新于 ${new Date(data.generatedAt || Date.now()).toLocaleTimeString("zh-CN", { hour12: false })}${data.version ? ` · v${data.version}` : ""}`;
  renderPending(data.pending || [], data.tasks || []);
  renderStats(data.runs);
  renderChart(data.runs);
  renderDist(data.runs);
  syncEffortFilter();
  renderTable();
}

async function load() {
  try {
    const res = await fetch("/api/runs", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
    data.runs ||= [];
    $("#alert").hidden = true;
    render();
  } catch (e) {
    const fileMode = location.protocol === "file:";
    $("#alert").hidden = false;
    $("#alert").textContent = fileMode
      ? "请通过本地服务打开此页面：在插件目录运行 npm run dashboard，然后访问它打印的地址。"
      : `读取数据失败（${e.message}）。dashboard 服务是否还在运行？`;
    $("#updated").textContent = "离线";
  }
}
const list = (title, items, fmt = esc) => items?.length ? `<div class="sec"><h3>${title}</h3><ul>${items.map((x) => `<li>${fmt(x)}</li>`).join("")}</ul></div>` : "";

async function openRun(id) {
  const brief = data.runs.find((r) => r.id === id) || { id };
  $("#dlgTitle").textContent = titleOf(brief);
  $("#dlgId").textContent = id;
  $("#dlgBody").innerHTML = '<div class="muted">加载中…</div>';
  if (!$("#dlg").open) $("#dlg").showModal();
  let r = brief;
  try {
    const res = await fetch(`/api/runs/${encodeURIComponent(id)}`, { cache: "no-store" });
    if (res.ok) r = await res.json();
  } catch {}
  const rep = r.report || {};
  const t = r.tokens;
  const kv = [
    ["状态", statusBadge(r)],
    ["开始", esc(fmtFull(r.startedAt))],
    ["耗时", esc(fmtDur(dur(r)))],
    ["模型", `<span class="mono">${esc(r.model || "config 默认")}</span>${r.effort ? ` · effort <b>${esc(r.effort)}</b>` : ""}${r.tier ? ` · 档位 ${esc(r.tier)}` : ""}${r.fast ? " · fast" : ""}`],
    ["沙箱", esc(r.sandbox || "—")],
    ["项目", `<span class="mono">${esc(r.cwd || "—")}</span>`],
    ["Session", `<span class="mono">${esc(r.sessionId || "—")}</span>${r.resumed ? " · 续接" : ""}${r.continuedFrom ? ` · 接续中断会话 ${esc(r.continuedFrom)}` : ""}`],
    ["Token", t ? `输入 ${fmtTok(t.input)}（缓存 ${fmtTok(t.cachedInput)}）· 输出 ${fmtTok(t.output)}${t.reasoning ? ` · 推理 ${fmtTok(t.reasoning)}` : ""}` : "—"],
  ];
  if (r.turns != null || r.toolCalls != null) kv.push(["执行", `${r.turns ?? "—"} 轮 · ${r.toolCalls ?? "—"} 次工具调用`]);
  const checks = r.checks?.length ? `<div class="sec"><h3>主机检查</h3>${r.checks.map((c) =>
      `<div class="chk">${badge(c.ok ? ["PASS", "b-ok"] : ["FAIL", "b-err"])}<span class="mono">${esc(c.command)}</span><span class="muted">${fmtDur(c.durationMs)}${c.timedOut ? " · 超时" : !c.ok && c.exitCode != null ? ` · exit ${c.exitCode}` : ""}</span></div>${c.lastLine ? `<div class="muted mono" style="margin:0 0 4px 52px">${esc(c.lastLine)}</div>` : ""}`).join("")}</div>` : "";
  const changes = r.changes?.length ? `<div class="sec"><h3>文件改动（${r.changes.length}）</h3>${r.changes.map((c) =>
      `<div class="chk"><span class="tag">${esc((c.xy || "").replace(/ /g, "."))}</span><span class="mono">${esc(c.path)}</span><span class="muted">${c.binary ? "binary" : c.added != null ? `<span style="color:var(--ok)">+${c.added}</span> <span style="color:var(--err)">-${c.removed || 0}</span>` : ""}</span></div>`).join("")}</div>` : "";
  $("#dlgBody").innerHTML = `
    <dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${r.error ? `<div class="sec"><h3>错误</h3><pre style="color:var(--err)">${esc(r.error)}</pre></div>` : ""}
    ${rep.summary || r.summary ? `<div class="sec"><h3>Codex 总结</h3><div>${esc(rep.summary || r.summary)}</div></div>` : ""}
    ${list("改动说明", rep.changes)}
    ${list("自测", rep.verification, (v) => `<span class="mono">${esc(v.command)}</span> <span class="muted">— ${esc(v.result)}</span>`)}
    ${list("风险", rep.risks)}
    ${list("待确认的问题", rep.questions)}
    ${checks}${changes}
    ${list("备注", r.notes)}
    <details${rep.summary ? "" : " open"}><summary>任务简报（prompt）</summary><pre>${esc(r.promptFull || r.prompt || "（无）")}</pre></details>
    ${r.lastMessage && !rep.summary ? `<details open><summary>Codex 最终回复</summary><pre>${esc(r.lastMessage)}</pre></details>` : ""}`;
}

$("#rows").addEventListener("click", (e) => { const tr = e.target.closest("tr[data-id]"); if (tr) openRun(tr.dataset.id); });
$("#rows").addEventListener("keydown", (e) => { const tr = e.target.closest("tr[data-id]"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openRun(tr.dataset.id); } });
$("#dlgClose").addEventListener("click", () => $("#dlg").close());
// Close only on clicks on the backdrop, i.e. outside the drawer's box.
$("#dlg").addEventListener("click", (e) => { const b = $("#dlg").getBoundingClientRect(); if (e.clientX < b.left) $("#dlg").close(); });
for (const id of ["#q", "#fState", "#fEffort"]) $(id).addEventListener("input", () => data && renderTable());
$("#refresh").addEventListener("click", load);
setInterval(() => { if ($("#auto").checked && !$("#dlg").open && !$("#pdlg").open && !document.hidden) load(); }, 10000);

// ---- 调度策略 ----
let pol = null; // { policy, defaults, models, efforts, defaultModel, file }
let saved = "";
const effortsFor = (slug) => pol.models.find((m) => m.slug === (slug || pol.defaultModel))?.efforts ?? pol.efforts;
const effortOpts = (slug, cur) => [...new Set([...effortsFor(slug), cur].filter(Boolean))]
  .map((e) => `<option${e === cur ? " selected" : ""}>${esc(e)}</option>`).join("");
function modelOpts(cur) {
  const slugs = [...new Set([...pol.models.map((m) => m.slug), cur].filter(Boolean))];
  return `<option value="">${pol.defaultModel ? `默认 · ${esc(pol.defaultModel)}` : "默认模型"}</option>` +
    slugs.map((s) => `<option${s === cur ? " selected" : ""}>${esc(s)}</option>`).join("");
}

function tierRow(t, i, n) {
  return `<div class="lrow" data-i="${i}">
    <span class="n">${i + 1}</span>
    <input class="mono" data-k="id" value="${esc(t.id)}" aria-label="档位名" maxlength="24">
    <select class="mono" data-k="model" aria-label="模型">${modelOpts(t.model)}</select>
    <select data-k="effort" aria-label="推理等级">${effortOpts(t.model, t.effort)}</select>
    <input class="use" data-k="use" value="${esc(t.use)}" title="${esc(t.use)}" aria-label="适用场景" placeholder="什么样的任务用这一档" maxlength="500">
    <span class="ops">
      <button type="button" data-op="up" aria-label="上移" ${i ? "" : "disabled"}>↑</button>
      <button type="button" data-op="down" aria-label="下移" ${i < n - 1 ? "" : "disabled"}>↓</button>
      <button type="button" data-op="del" aria-label="删除" ${n > 1 ? "" : "disabled"}>✕</button>
    </span>
  </div>`;
}
function readTiers() {
  return [...document.querySelectorAll("#tiers .lrow")].map((el) => {
    const v = (k) => el.querySelector(`[data-k="${k}"]`).value.trim();
    const t = { id: v("id"), effort: v("effort"), use: v("use") };
    if (v("model")) t.model = v("model");
    return t;
  });
}
const renderTiers = (tiers) => { $("#tiers").innerHTML = tiers.map((t, i) => tierRow(t, i, tiers.length)).join(""); };
function renderChips(selected) {
  const slugs = [...new Set([...pol.models.map((m) => m.slug), ...selected])];
  $("#pModels").innerHTML = slugs.length
    ? slugs.map((s) => `<button type="button" class="chip" aria-pressed="${selected.includes(s)}" value="${esc(s)}">${esc(s)}</button>`).join("")
    : '<span class="muted">没有读到 codex 的模型缓存（运行一次 codex 即可生成）</span>';
}
const collect = () => ({
  guidance: $("#pGuide").value, codexGuidance: $("#pCodex").value, tiers: readTiers(),
  models: [...document.querySelectorAll('#pModels .chip[aria-pressed="true"]')].map((c) => c.value),
});
function fillForm(p) {
  $("#pGuide").value = p.guidance;
  $("#pCodex").value = p.codexGuidance;
  renderTiers(p.tiers);
  renderChips(p.models);
  markDirty();
}
function markDirty() {
  const dirty = JSON.stringify(collect()) !== saved;
  $("#pDirty").textContent = dirty ? "未保存" : "";
  $("#pSave").disabled = !dirty;
}
let toastTimer;
function showMsg(text, kind = "info") {
  clearTimeout(toastTimer);
  $("#pMsg").hidden = !text;
  $("#pMsg").className = `toast ${kind}`;
  $("#pMsg").textContent = text || "";
  if (text && kind === "ok") toastTimer = setTimeout(() => ($("#pMsg").hidden = true), 4000);
}

async function openPolicy() {
  showMsg("");
  if (!$("#pdlg").open) $("#pdlg").showModal();
  try {
    const res = await fetch("/api/policy", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    pol = await res.json();
  } catch (e) {
    showMsg(`读取策略失败（${e.message}）`, "err");
    return;
  }
  $("#pFile").textContent = pol.file;
  saved = "";
  fillForm(pol.policy);
  saved = JSON.stringify(collect());
  markDirty();
  if (pol.error) showMsg(`策略文件有问题，当前用的是默认策略：${pol.error}`, "err");
}

$("#tiers").addEventListener("click", (e) => {
  const op = e.target.closest("[data-op]")?.dataset.op;
  if (!op) return;
  const tiers = readTiers();
  const i = +e.target.closest(".lrow").dataset.i;
  if (op === "del") tiers.splice(i, 1);
  else { const j = op === "up" ? i - 1 : i + 1; [tiers[i], tiers[j]] = [tiers[j], tiers[i]]; }
  renderTiers(tiers);
  markDirty();
});
// Switching model: offer only the efforts it supports, keeping the current one when possible.
$("#tiers").addEventListener("change", (e) => {
  if (e.target.dataset.k !== "model") return;
  const sel = e.target.closest(".lrow").querySelector('[data-k="effort"]');
  const list = effortsFor(e.target.value);
  const cur = list.includes(sel.value) ? sel.value : list.at(-1);
  sel.innerHTML = effortOpts(e.target.value, cur);
});
$("#pModels").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  chip.setAttribute("aria-pressed", chip.getAttribute("aria-pressed") !== "true");
  markDirty();
});
$("#pForm").addEventListener("input", markDirty);
$("#pForm").addEventListener("change", markDirty);
$("#addTier").addEventListener("click", () => {
  const tiers = readTiers();
  tiers.push({ id: `tier-${tiers.length + 1}`, effort: "medium", use: "" });
  renderTiers(tiers);
  markDirty();
  document.querySelector("#tiers .lrow:last-child [data-k=use]").focus();
});
$("#pReset").addEventListener("click", () => { fillForm(pol.defaults); showMsg("已填入默认策略，保存后生效"); });
$("#pForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const res = await fetch("/api/policy", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(collect()) });
    const r = await res.json();
    if (!res.ok) { showMsg(`没有保存：${r.error}`, "err"); return; }
    pol = r;
    saved = "";
    fillForm(pol.policy);
    saved = JSON.stringify(collect());
    markDirty();
    showMsg("已保存，下一次调用即生效", "ok");
  } catch (err) {
    showMsg(`保存失败（${err.message}）`, "err");
  }
});
$("#policyBtn").addEventListener("click", openPolicy);
const leaveOk = () => !$("#pDirty").textContent || confirm("有未保存的修改，确定关闭？");
$("#pClose").addEventListener("click", () => { if (leaveOk()) $("#pdlg").close(); });
$("#pdlg").addEventListener("cancel", (e) => { if (!leaveOk()) e.preventDefault(); });
$("#pdlg").addEventListener("click", (e) => { const b = $("#pdlg").getBoundingClientRect(); if (e.clientX < b.left && leaveOk()) $("#pdlg").close(); });
</script>

</body>
</html>
